<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Stats Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>⚽ Football Stats Dashboard</h1>
    <p id="last-updated">Φόρτωση...</p>
  </header>

  <nav>
    <button class="tab-button active" data-league="bundesliga">Bundesliga</button>
    <button class="tab-button" data-view="upcoming">Επόμενη Αγωνιστική</button>
    <button class="tab-button" data-view="form">Φόρμα (τελ. 10)</button>
    <button class="tab-button" data-view="referees">Διαιτητές</button>
    <button class="tab-button" data-view="elo">Κατάταξη Elo</button>
  </nav>

  <main>
    <div id="team-view">
      <table id="team-table">
        <thead>
          <tr>
            <th>Ομάδα</th>
            <th>Αγώνες</th>
            <th>Σουτ</th>
            <th>Σουτ στο στόχο</th>
            <th>Φάουλ</th>
            <th>Κόρνερ</th>
            <th>Οφσάιντ</th>
            <th>Κίτρινες</th>
          </tr>
        </thead>
        <tbody id="team-table-body"></tbody>
      </table>
    </div>

    <div id="elo-view" style="display:none;">
      <table id="elo-table">
        <thead>
          <tr><th>#</th><th>Ομάδα</th><th>Elo</th></tr>
        </thead>
        <tbody id="elo-table-body"></tbody>
      </table>
    </div>

    <div id="form-view" style="display:none;">
      <table id="form-table">
        <thead>
          <tr>
            <th>Ομάδα</th>
            <th>Αγώνες</th>
            <th>Σουτ</th>
            <th>Σουτ στο στόχο</th>
            <th>Φάουλ</th>
            <th>Κόρνερ</th>
            <th>Οφσάιντ</th>
            <th>Κίτρινες</th>
          </tr>
        </thead>
        <tbody id="form-table-body"></tbody>
      </table>
    </div>

    <div id="referees-view" style="display:none;">
      <table id="referees-table">
        <thead>
          <tr>
            <th>Διαιτητής</th>
            <th>Αγώνες</th>
            <th>Φάουλ Αγώνα (μ.ο.)</th>
            <th>Κίτρινες Αγώνα (μ.ο.)</th>
          </tr>
        </thead>
        <tbody id="referees-table-body"></tbody>
      </table>
    </div>

    <div id="upcoming-view" style="display:none;">
      <div class="sliders-panel">
        <h3>Ρύθμιση επιρροής μοντέλου</h3>
        <div class="slider-row">
          <label for="w-form">Φόρμα (τελ. 10)</label>
          <input type="range" id="w-form" class="weight-slider" min="0" max="1" step="0.05" value="0.4">
          <span id="w-form-label">40%</span>
        </div>
        <div class="slider-row">
          <label for="w-venue">Ιστορικό έδρας</label>
          <input type="range" id="w-venue" class="weight-slider" min="0" max="1" step="0.05" value="0.25">
          <span id="w-venue-label">25%</span>
        </div>
        <div class="slider-row">
          <label for="w-defense">Άμυνα αντιπάλου</label>
          <input type="range" id="w-defense" class="weight-slider" min="0" max="1" step="0.05" value="0.15">
          <span id="w-defense-label">15%</span>
        </div>
        <div class="slider-row">
          <label for="w-referee">Διαιτητής (σουτ/κόρνερ κτλ.)</label>
          <input type="range" id="w-referee" class="weight-slider" min="0" max="1" step="0.05" value="0.2">
          <span id="w-referee-label">20%</span>
        </div>
        <div class="slider-row">
          <label for="w-referee-boosted">Διαιτητής (φάουλ/κάρτες)</label>
          <input type="range" id="w-referee-boosted" class="weight-slider" min="0" max="1" step="0.05" value="0.35">
          <span id="w-referee-boosted-label">35%</span>
        </div>
        <div class="slider-row">
          <label for="w-elo">Elo (αναδιανομή δύναμης)</label>
          <input type="range" id="w-elo" class="weight-slider" min="0" max="1" step="0.05" value="0.35">
          <span id="w-elo-label">35%</span>
        </div>
        <button id="reset-sliders-btn" onclick="resetSliders()">Επαναφορά προεπιλογών</button>
      </div>
      <div id="upcoming-matches"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>

name: Update football stats data

on:
  schedule:
    # Τρέχει κάθε μέρα στις 06:00 UTC (~09:00 ώρα Ελλάδας)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Επιτρέπει και χειροκίνητο τρέξιμο από το tab "Actions" του GitHub

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run update script
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/update_all.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          git diff --quiet --cached || git commit -m "Αυτόματη ενημέρωση δεδομένων"
          git push
